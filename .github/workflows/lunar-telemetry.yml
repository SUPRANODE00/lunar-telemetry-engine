name: Lunar Telemetry Engine Pipeline

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  execute-telemetry:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Run Matrix Telemetry Engine
        run: |
          python3 mat_bridge_loader.py
          cat telemetry_output.json

      - name: Upload Artifact HUD Report
        uses: actions/upload-artifact@v4
        with:
          name: lunar-hud-telemetry-report
          path: telemetry_output.json
