name: Lunar Telemetry Engine Pipeline

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  execute-telemetry:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Octave Engine
        run: |
          sudo apt-get update
          sudo apt-get install -y octave

      - name: Run Matrix Alignment & Decoder
        run: |
          octave --eval "align_trinity"
          python3 mat_stream_decoder.py
          cat decoded_telemetry.json

      - name: Upload Artifact HUD Report
        uses: actions/upload-artifact@v4
        with:
          name: lunar-hud-telemetry-report
          path: decoded_telemetry.json
