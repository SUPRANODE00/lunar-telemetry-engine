<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>AXIS // Lunar Telemetry HUD</title>
    <style>
        body { margin: 0; background: #050505; color: #00ffcc; font-family: monospace; overflow: hidden; }
        #hud { position: absolute; top: 20px; left: 20px; z-index: 10; background: rgba(0,0,0,0.8); padding: 15px; border: 1px solid #00ffcc; }
        canvas { display: block; }
    </style>
</head>
<body>
    <div id="hud">
        <h3>AXIS TELEMETRY MESH</h3>
        <p>STATUS: <span id="status">INITIALIZING</span></p>
        <p>ANCHOR: [826.0, 770.0, 0.0]</p>
    </div>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script>
        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.body.appendChild(renderer.domElement);

        const geometry = new THREE.SphereGeometry(0.5, 32, 32);
        const material = new THREE.MeshBasicMaterial({ color: 0x00ffcc, wireframe: true });
        
        const nodes = [];
        // Project anchor grid points
        const coords = [[1, 0, 0], [0, 1, 0], [-1, 0, 0], [0, -1, 0], [1, 0, 0]];
        coords.forEach((pos, idx) => {
            const mesh = new THREE.Mesh(geometry, material);
            mesh.position.set(pos[0] * 3, pos[1] * 3, pos[2] * 3);
            scene.add(mesh);
            nodes.push(mesh);
        });

        camera.position.z = 10;

        function animate() {
            requestAnimationFrame(animate);
            nodes.forEach((node, index) => {
                node.rotation.x += 0.01 * (index + 1);
                node.rotation.y += 0.02;
            });
            renderer.render(scene, camera);
        }
        animate();

        fetch('decoded_telemetry.json')
            .then(res => res.json())
            .then(data => {
                document.getElementById('status').innerText = data.status || 'ONLINE';
            })
            .catch(() => {
                document.getElementById('status').innerText = 'LOCAL MESH ACTIVE';
            });
    </script>
</body>
</html>
